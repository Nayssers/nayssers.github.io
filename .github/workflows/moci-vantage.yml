name: MOCI read-only vantage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public MOCI clients and same-origin assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p moci-fetch
          cat > /tmp/fetch.py <<'PY'
          import json, pathlib, re, ssl, urllib.error, urllib.parse, urllib.request

          out = pathlib.Path('moci-fetch')
          origins = [
              'https://mocibetaqual.deere.com/',
              'https://mocibeta.deere.com/',
          ]
          seeds = [
              '/', '/index.html', '/asset-manifest.json', '/manifest.json', '/robots.txt',
              '/config.json', '/config.js', '/env.js', '/static/js/main.js'
          ]
          context = ssl.create_default_context()
          results = []
          seen = set()

          def fetch(origin, path):
              url = urllib.parse.urljoin(origin, path)
              parsed = urllib.parse.urlparse(url)
              allowed = urllib.parse.urlparse(origin)
              if parsed.scheme != 'https' or parsed.hostname != allowed.hostname or url in seen:
                  return None
              seen.add(url)
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                  'Accept': 'text/html,application/json,application/javascript,text/javascript,*/*',
              })
              body = b''
              status = None
              headers = {}
              error = None
              try:
                  with urllib.request.urlopen(request, timeout=25, context=context) as response:
                      status = response.status
                      headers = dict(response.headers.items())
                      body = response.read(8 * 1024 * 1024)
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  headers = dict(exc.headers.items())
                  body = exc.read(8 * 1024 * 1024)
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'
              key = f'{allowed.hostname}_{len(results):03d}'
              (out / f'{key}.body').write_bytes(body)
              (out / f'{key}.headers.json').write_text(json.dumps(headers, indent=2), encoding='utf-8')
              item = {'origin': origin, 'url': url, 'status': status, 'bytes': len(body), 'headers': headers, 'error': error, 'key': key}
              results.append(item)
              return body, headers, status

          for origin in origins:
              for seed in seeds:
                  fetched = fetch(origin, seed)
                  if not fetched:
                      continue
                  body, headers, status = fetched
                  content_type = headers.get('Content-Type', '')
                  if status == 200 and ('text/html' in content_type or seed in ('/', '/index.html')):
                      text = body.decode('utf-8', errors='ignore')
                      assets = re.findall(r'''(?:src|href)=["']([^"']+)["']''', text, flags=re.I)
                      for asset in assets[:80]:
                          if re.search(r'\.(?:js|mjs|json|css)(?:[?#].*)?$', asset, flags=re.I):
                              fetch(origin, asset)

          (out / 'summary.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          print(json.dumps(results, indent=2))
          PY
          python /tmp/fetch.py

      - name: Upload response artifact
        uses: actions/upload-artifact@v4
        with:
          name: moci-public-client-fetch
          path: moci-fetch
          retention-days: 1
