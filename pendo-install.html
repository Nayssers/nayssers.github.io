<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendo installation verification</title>
  <script>
    (function () {
      var events = [];
      function record(kind, value) {
        var row = { at: new Date().toISOString(), kind: kind, value: value };
        events.push(row);
        try { localStorage.setItem('pendo-preview-events', JSON.stringify(events)); } catch (_) {}
        var output = document.getElementById('preview-events');
        if (output) output.textContent = JSON.stringify(events, null, 2);
      }
      window.alert = function (value) { record('alert', String(value)); };
      window.addEventListener('message', function (event) {
        var serialized;
        try { serialized = JSON.parse(JSON.stringify(event.data)); }
        catch (_) { serialized = String(event.data); }
        record('message', { origin: event.origin, data: serialized });
      });
      window.addEventListener('error', function (event) {
        record('error', String(event.message || event.error || 'unknown'));
      });
      window.__previewEvents = events;
    })();
  </script>
  <script>
    (function (apiKey) {
      (function (p, e, n, d, o) {
        var v, w, x, y, z;
        o = p[d] = p[d] || {};
        o._q = o._q || [];
        v = ['initialize', 'identify', 'updateOptions', 'pageLoad', 'track', 'trackAgent'];
        for (w = 0, x = v.length; w < x; ++w) (function (m) {
          o[m] = o[m] || function () {
            o._q[m === v[0] ? 'unshift' : 'push']([m].concat([].slice.call(arguments, 0)));
          };
        })(v[w]);
        y = e.createElement(n);
        y.async = true;
        y.src = 'https://cdn.pendo.io/agent/static/' + apiKey + '/pendo.js';
        z = e.getElementsByTagName(n)[0];
        z.parentNode.insertBefore(y, z);
      })(window, document, 'script', 'pendo');
    })('4382da8f-60bd-422c-8d0c-25fee5a1e897');

    pendo.initialize({
      visitor: { id: 'nayssers-github-pages-verification' },
      account: { id: 'nayssers-github-pages' }
    });
  </script>
</head>
<body>
  <h1>Pendo installation verification</h1>
  <p>The Pendo web agent is installed on this page.</p>
  <pre id="preview-events">[]</pre>
</body>
</html>
